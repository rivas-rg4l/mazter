name: Build MasterPack (Windows VST3)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows MSVC (VS 2022) - Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + Visual Studio 17 2022)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release) - todos los plugins
        run: cmake --build build --config Release --parallel

      - name: Verify and package (un zip por plugin)
        shell: pwsh
        run: |
          $plugins = @(
            @{ target = 'MasterEQ';      product = 'Master EQ' },
            @{ target = 'MasterComp';    product = 'Master Comp' },
            @{ target = 'MasterSat';     product = 'Master Sat' },
            @{ target = 'MasterImager';  product = 'Master Imager' },
            @{ target = 'MasterLimiter'; product = 'Master Limiter' }
          )
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($p in $plugins) {
            $vst3 = "build/$($p.target)_artefacts/Release/VST3/$($p.product).vst3"
            if (-not (Test-Path $vst3)) { Write-Error "No se encontro el VST3: $vst3"; exit 1 }
            $zip = "artifacts/" + ($p.product -replace ' ', '-') + "-VST3-win64.zip"
            Compress-Archive -Path $vst3 -DestinationPath $zip -Force
            Write-Host "OK  $vst3"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MasterPack-VST3-Windows
          path: artifacts/*
          if-no-files-found: error
